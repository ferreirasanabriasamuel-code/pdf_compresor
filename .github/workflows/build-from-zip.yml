name: Compilar APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Localizar el proyecto (zip subido o archivos sueltos)
        id: proj
        run: |
          DIR=""
          Z=$(ls -S *.zip 2>/dev/null | head -1 || true)
          if [ -n "$Z" ]; then
            echo "Zip encontrado: $Z — descomprimiendo..."
            mkdir -p _trabajo
            unzip -q -o "$Z" -d _trabajo
            GW=$(find _trabajo -name gradlew -type f | head -1)
            if [ -n "$GW" ]; then
              DIR=$(dirname "$GW")
            fi
          fi
          if [ -z "$DIR" ] && [ -f gradlew ]; then
            DIR="."
          fi
          if [ -z "$DIR" ]; then
            echo "::error::No se encontró el proyecto en la raíz del repo. Sube pdf-compresor-android.zip (Add file → Upload files) y vuelve a ejecutar el workflow."
            exit 1
          fi
          # Sin esto el build falla: la subida web pierde el permiso de ejecución.
          chmod +x "$DIR/gradlew"
          echo "Proyecto en: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Compilar APK debug (instalable directamente)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Compilar APK release (firmada con la llave incluida en el proyecto)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Guardar APKs como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Compresor-APK
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/**/app-*.apk
          if-no-files-found: error
